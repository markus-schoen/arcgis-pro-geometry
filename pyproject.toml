[build-system]
# 77.0 is the first release that understands the PEP 639 'license' / 'license-files' fields below.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arcgis-pro-geometry"
version = "2.0.0"
description = "A collection of geometry tools for ArcGIS Pro"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Markus Schön" }]
requires-python = ">=3.9"
keywords = ["arcgis", "arcgis-pro", "arcpy", "gis", "geometry", "toolbox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

# Note: arcpy and numpy are provided by the ArcGIS Pro installation (conda).
# arcpy is not available on PyPI and cannot be listed as a pip dependency.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/markus-schoen/arcgis-pro-geometry"
Repository = "https://github.com/markus-schoen/arcgis-pro-geometry"
Issues = "https://github.com/markus-schoen/arcgis-pro-geometry/issues"
Changelog = "https://github.com/markus-schoen/arcgis-pro-geometry/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]


# TESTS ----------------------------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
markers = [
    "unit: Unit tests, run without an ArcGIS Pro license (pytest -m unit)",
    "integration: Integration tests, require an ArcGIS Pro license (pytest -m integration)",
]


# LINTING --------------------------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff specific rules
]
ignore = [
    "UP008",   # super() call - kept for Python 3.9 compatibility of the ArcGIS Pro environment
    "UP032",   # .format() vs f-string - not enforced in the arcpy tool scripts
    "RUF012",  # mutable class attributes are the documented lookup tables of Geometry
]

[tool.ruff.lint.per-file-ignores]
# The integration tests skip themselves when arcpy is missing, so 'pytest.importorskip' has to run before the package
# import.
"tests/integration/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["arcgis_pro_geometry"]
# One blank line after an import block: it separates the arcpy import from the sys.path bootstrap of the tool scripts.
lines-after-imports = 1
