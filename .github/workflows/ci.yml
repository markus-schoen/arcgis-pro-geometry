name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.5"

      - name: Check code style
        run: ruff check --output-format=github .

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the Python version shipped with ArcGIS Pro 3.x, 3.11 is the version of ArcGIS Pro 3.5/3.6.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # arcpy is not available on PyPI. The unit tests mock it, so only numpy and pytest are needed here.
        run: python -m pip install --upgrade pytest numpy

      - name: Run unit tests
        # The integration tests need an ArcGIS Pro license and skip themselves on CI.
        run: python -m pytest tests/unit -v
